name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install build and test dependencies
        run: python -m pip install -r requirements-build.txt 'pytest>=8,<10'

      - name: Run regression tests
        run: python -m pytest

      - name: Build, smoke test and package binary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: python scripts/build_release.py --tag "$RELEASE_TAG" --arch "$RELEASE_ARCH"

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-linux-*
          path: dist/release
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist/release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f "JellyfinProxy_${RELEASE_TAG}_linux_amd64.tar.gz"
          test -f "JellyfinProxy_${RELEASE_TAG}_linux_arm64.tar.gz"
          sha256sum JellyfinProxy_*.tar.gz > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
